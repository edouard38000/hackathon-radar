[package]
name = "hackathon-radar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A self-hosted tracker that finds hackathons that fit you and alerts you about them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/edouard38000/hackathon-radar"
homepage = "https://github.com/edouard38000/hackathon-radar"
documentation = "https://github.com/edouard38000/hackathon-radar/blob/main/docs/setup-guide.md"
readme = "README.md"
keywords = ["hackathon", "tracker", "cli", "self-hosted"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml", "/Cargo.lock", "/src/**", "/README.md", "/LICENSE-*",
    "/GLOSSARY.md", "/docs/adr/**", "/docs/setup-guide.md", "/examples/profile.toml",
    "/.claude/skills/setup-hackathon-radar/SKILL.md",
    "/sidecar/photon/package.json", "/sidecar/photon/package-lock.json",
    "/sidecar/photon/*.mjs", "/sidecar/photon/.npmrc",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
keyring = "4"
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
ureq = "3"

# `doctor` reads Keychain items with prompts turned off, to see what a
# scheduled Run would see; `keyring` already builds on this crate on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"


[dev-dependencies]
# Parses the setup skill's YAML frontmatter in tests/setup_skill.rs.
serde_norway = "0.9"
