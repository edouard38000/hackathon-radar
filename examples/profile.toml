# An example Profile. `hackathon-radar init` writes yours for you; or copy this
# to ~/.config/hackathon-radar/profile.toml (or pass it with --profile) and
# change it to suit you. It holds no secrets: `init` stores keys and tokens in
# your keychain.

# The countries you'll travel to at your own cost. A region stands for its
# members: "Schengen", "European Union" (or "EU"), "EEA", "Europe", "Benelux",
# "DACH", "Nordics", "North America", and US regions "US West Coast",
# "US East Coast" and "US Northeast". A US state counts too ("California", "TX").
countries = ["Belgium", "France", "Netherlands", "Luxembourg"]

# The currency you count money in, as an ISO code. Optional: without it, the
# currency of Home's country (the euro if it isn't known).
# currency = "EUR"

# Themes: subjects you want Hackathons about. Optional. With Themes, a
# Hackathon Fits when it is about one of them or open-themed (build anything);
# one clearly about something else doesn't. Without, every subject Fits.
# themes = ["AI agents", "climate"]

# The city you travel from, its country (optional; with it, train trips within
# that country count as local), and the airports you fly out of (IATA codes).
[home]
city = "Brussels"
country = "Belgium"
airports = ["BRU", "CRL"]

# Getting there. Optional: without it, the Train limit is 4 hours. A train
# journey longer than the Train limit counts as a flight. Your Agent estimates
# train times and nearest airports once per city; correct any of them with an
# override, which sets train_hours, airport, or no_practical_flight = true.
# The Travel-funded rule: with travel_funded_anywhere = true, a Hackathon whose
# organiser covers travel or lodging counts anywhere in the world, outside your
# Countries too. Off by default, because your Agent then also judges listings
# from every other country.
# [travel]
# train_limit_hours = 4
# travel_funded_anywhere = false
#
# The Flight budget: the most you'd pay for a return flight, in your currency.
# With it, a flight Fits only when its Fare is at or under the budget (under the
# Travel-funded rule, a Travel-funded Hackathon skips it). Fares come from Google Flights through your
# own SerpApi key, which `hackathon-radar init` stores in your keychain; without a key,
# your Agent estimates them and they are marked unverified.
# flight_budget = 200
#
# [[travel.overrides]]
# city = "Munich"
# train_hours = 5.5
# airport = "MUC"

# How sparingly Fares are looked up, to stay within SerpApi's free plan of 250
# searches a month. Optional; these are the defaults.
# [fares]
# horizon_weeks = 10    # look up Fares for Hackathons starting within 10 weeks;
#                       # later ones are announced with the fare checked later
# refresh_days = 14     # look a Fare up again after 14 days
# lookups_per_run = 10  # at most 10 lookups on one Run

# Where Alerts go. Without this section, Alerts are only printed.
# ntfy (https://ntfy.sh) needs no account: install its phone app, subscribe to
# a topic, and put the same topic here. Anyone who knows a topic on ntfy.sh can
# read it, so pick a long, hard-to-guess one instead of this example.
# Add `server = "https://ntfy.example.org"` to use your own ntfy server; if it
# needs an access token, `hackathon-radar init` stores it in your keychain.
# [alert_channel]
# kind = "ntfy"
# topic = "hackathon-radar-example-7f3k9q"
#
# For iMessage Alerts from your own Photon line instead (see the README), use
#   kind = "photon"
#   to = "+32470123456"    (your phone number, in E.164 format)
# and let `hackathon-radar init` store your Photon project ID and secret in your keychain.

# When `hackathon-radar schedule install` runs a Run, in local time. Optional:
# without it, Runs happen every Monday and Thursday at 08:00.
# [schedule]
# days = ["Monday", "Thursday"]
# time = "08:00"

# Application deadlines. Optional; these are the defaults. A Deadline reminder
# goes out reminder_days before an open Hackathon that fits you closes. On each
# Run your Agent rechecks the deadline, status and travel funding of up to
# rechecks_per_run known Hackathons starting within recheck_horizon_days,
# nearest deadline first, each at most once every recheck_every_days. A closed
# Hackathon is rechecked too while it could still reopen (its deadline unknown
# or not passed, and it hasn't started), but only every 2 x recheck_every_days,
# soonest first: one slot is kept for closed ones when any is due (unless
# rechecks_per_run is 1), plus any room the open ones leave, at most a quarter
# of rechecks_per_run; if one reopens, the next Alert announces it. Rechecks
# are one request held to agent.max_turns (below), and each takes at least one
# step, so rechecks_per_run can't exceed max_turns; a page or two each fits well.
# [deadlines]
# reminder_days = 3
# rechecks_per_run = 10
# recheck_every_days = 3
# recheck_horizon_days = 120

# Facts organisers restrict on. Leave out any you'd rather not give; the Agent
# then treats them as no obstacle.
[eligibility]
student = false
nationalities = ["Belgian"]
# age = 27

# The Agent that judges listings, and the most steps it may take on one Run.
[agent]
adapter = "claude-code"
max_turns = 50
# The most steps the Agent may take estimating train times and airports for
# new cities, a separate, smaller request. Optional: 15 by default.
# travel_max_turns = 15
# The most steps the Agent may take estimating Fares, only when you have no
# SerpApi key. Optional: 10 by default.
# fare_max_turns = 10

# To use Codex instead, replace the adapter line above with the two lines below.
# It runs `codex exec` in a read-only sandbox with live web search, on your own
# `codex` login (or CODEX_API_KEY). Codex has no step cap of its own, so
# max_turns doesn't apply to it. The Codex adapter is experimental: its
# read-only lockdown is unverified against a real Codex CLI, so it only runs
# when you opt in knowingly with experimental = true.
# adapter = "codex"
# experimental = true

# To use any other coding agent, replace the adapter line above with the two
# lines below and give your agent's command. It runs without a shell, in an
# empty directory, with the prompt on stdin, and must print only JSON matching the
# schema. You must make it read-only: web search and page reading, nothing else
# (see the README). Placeholders: {schema_file} (the schema's path), {schema}
# (the schema itself), {prompt} (then stdin stays empty) and {max_turns}.
# adapter = "command"
# command = ["my-agent", "--json", "--schema", "{schema_file}"]

# Sources. Optional: the global Sources (Devpost, MLH, ETHGlobal, the CASSINI
# Hackathons and dev.events) are always read, and so is the Source pack for
# Home's country: "europe" (hackathon.be, hackathonhub.eu and European Luma
# calendars) or "north-america" (Luma's San Francisco, New York and Boston
# calendars). Add other packs with `packs`, and your own
# ICS calendar feeds with `ics`. A Run fetches at most
# `hackathonhub_pages_per_run` new hackathonhub.eu event pages (default 40).
# [sources]
# packs = ["north-america"]
# ics = ["https://example.org/community-hackathons.ics"]
# hackathonhub_pages_per_run = 40
