name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read Cargo version and check the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hackathon-radar") | .version')
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The two macOS builds run on Edouard's own Mac (a self-hosted runner), not
  # on GitHub's macOS runners, whose minutes cost money and used up the
  # account's included Actions usage. This workflow runs only on a pushed v*
  # tag or a manual workflow_dispatch, never on pull_request (the test in
  # tests/release_workflow.rs checks that). This is not a security boundary on
  # its own, since a PR could add a workflow of its own: keep approval for
  # outside contributors' workflow runs on. While the Mac's runner is offline
  # the macOS builds queue for up to 24 hours, then fail, and the Release is
  # not published; re-run the failed jobs once the Mac is online.
  #
  # The Mac is a persistent machine, so the steps leave no global state behind:
  # rustup installs the toolchain and targets but never changes the default
  # toolchain, and cargo always runs through `rustup run stable`.
  build:
    name: Build ${{ matrix.target }}
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
          # Cross-compile with Apple's native toolchain on the arm64 Mac.
          # No Docker or cross is needed.
          - target: x86_64-apple-darwin
            os: [self-hosted, macOS, ARM64]
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$HOME/.cargo/bin" ]]; then echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"; fi
          if ! command -v rustup > /dev/null; then
            echo "::error::rustup is not installed on this runner. Install it once by hand (https://rustup.rs) so rustup is on PATH or in ~/.cargo/bin; the workflow does not install it."
            exit 1
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: rustup run stable cargo build --release --locked --target "$TARGET"
      - name: Package binary and Photon sidecar
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package="hackathon-radar-$VERSION-$TARGET"
          stage_dir="stage/$package"
          mkdir -p "$stage_dir/sidecar/photon" "$stage_dir/docs" dist
          cp "target/$TARGET/release/hackathon-radar" "$stage_dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage_dir/"
          cp docs/setup-guide.md "$stage_dir/docs/"
          cp sidecar/photon/package.json sidecar/photon/package-lock.json sidecar/photon/.npmrc sidecar/photon/*.mjs "$stage_dir/sidecar/photon/"
          archive="$package.tar.gz"
          tar -czf "dist/$archive" -C stage "$package"
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hackathon-radar-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hackathon-radar-*
          merge-multiple: true
          path: dist
      - name: Create Release or replace its assets on a retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY" --title "hackathon-radar $RELEASE_TAG"
          fi
