name: Feature request
description: Suggest something hackathon-radar should do, such as a new Source, Agent or Alert channel.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please use the words from [GLOSSARY.md](https://github.com/edouard38000/hackathon-radar/blob/main/GLOSSARY.md) (Profile, Run, Source, Candidate, Alert…), and check the [ADRs](https://github.com/edouard38000/hackathon-radar/tree/main/docs/adr) for decisions already made, such as self-hosted only (ADR 0001) and the Agent only searching and reading (ADR 0004).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should work for you, as someone running hackathon-radar.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, examples, or for a new Source, its URL and whether its terms allow automated reading.
